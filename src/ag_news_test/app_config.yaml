# Application Configuration
#
# This file contains settings for the Folder Organizer application.
# Adjust these based on your local setup and research needs.

# LLM Settings
model_name: "llama3.1:8b"              # Ollama model name (e.g., llama3, mistral, mixtral)
max_tokens: 4096                  # Maximum context window tokens
temperature: 0.1                  # Low temperature for consistent classification

# Ollama Settings
ollama_base_url: "http://localhost:11434"   # Ollama API endpoint

# Concurrency Settings
max_concurrent_requests: 3        # Limit parallel requests to prevent resource exhaustion

# Prompt Strategy
# Options: direct, cot (chain_of_thought), defensive
prompt_strategy: "direct"

# Output Settings
quarantine_folder: "_Unclassified"          # Folder for failed classifications
log_file: "classification_results.jsonl"    # Experiment log filename

# Dataset Label Mapping
# Maps integer labels from the HuggingFace dataset to class name strings.
# Must match the class names defined in classes.yaml.
label_mapping:
  1: "World"
  2: "Sports"
  3: "Business"
  4: "SciTech"
