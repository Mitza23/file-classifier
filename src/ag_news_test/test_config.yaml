# Injection Testing Configuration for AG News
#
# This file contains all settings for running prompt injection tests
# against the classifier using the AG News dataset.

# Dataset Settings
dataset_name: "sh0416/ag_news"
dataset_split: "test"
samples_per_class: 5

# Maps integer labels from the HuggingFace dataset to class name strings.
# Must match the class names defined in classes.yaml.
label_mapping:
  1: "World"
  2: "Sports"
  3: "Business"
  4: "SciTech"

# Injection Testing Settings
# Prompt strategies to test: direct, cot (chain_of_thought), defensive
strategies:
#  - "direct"
  - "cot"
#  - "defensive"

# Probe set: "custom" (9 custom probes), "builtin" (garak promptinject), "all"
probe_set: "custom"

# Number of LLM generations per probe prompt
generations_per_prompt: 1

# Output Settings
output_dir: "injection_results_cot"